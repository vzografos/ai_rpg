[project]
name = "ai-rpg"
version = "0.0.1"
description = "Text-based LLM Dungeon Master: the LLM narrates, a deterministic engine adjudicates, a database remembers. Strict Docker, web-first."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# The in-container uv cache lives under /app/.cache (HOME=/app); never lint it.
extend-exclude = [".cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg"]
