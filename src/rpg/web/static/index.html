<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai_rpg — text-based LLM Dungeon Master</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #161a22; --line: #262c38;
    --text: #d7dce5; --dim: #8b93a3; --accent: #e0b34c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.45 system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); display: flex;
  }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; align-items: baseline; gap: 10px;
  }
  header small { color: var(--dim); font-weight: 400; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 75ch; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .msg.player { align-self: flex-end; background: #1d2735; border: 1px solid var(--line); }
  .msg.dm { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.dm.pending { color: var(--dim); }
  .msg.system {
    align-self: center; background: none; border: none; padding: 2px;
    color: var(--accent); font-size: 13px; font-style: italic;
  }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  form input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font: inherit;
  }
  form button {
    background: var(--accent); color: #1a1a1a; border: none; border-radius: 8px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  aside {
    width: 300px; border-left: 1px solid var(--line); padding: 16px;
    display: flex; flex-direction: column; gap: 18px; background: var(--panel);
    overflow-y: auto;
  }
  aside h2 {
    margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim);
  }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--dim); vertical-align: baseline;
  }
  .ok .dot { background: #4caf50; }
  .err .dot { background: #e05252; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--dim); }
  .kv b { color: var(--text); font-weight: 500; text-align: right; word-break: break-all; }
  #llm-hello, #dice-log, #quest-log { font-size: 13px; color: var(--dim); margin: 6px 0 0; }
  #quest-log li { margin: 2px 0; }
  #quest-log .current { color: var(--text); }
  #new-session {
    width: 100%; margin-top: 6px; background: none; border: 1px solid var(--accent);
    color: var(--accent); border-radius: 8px; padding: 8px; font: inherit; cursor: pointer;
  }
  #new-session:disabled { opacity: .4; cursor: default; }
  .hp-low { color: #e05252; }
  #xp-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 6px; }
  #xp-bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  @media (max-width: 720px) { body { flex-direction: column; } aside { width: auto; border-left: none; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <header>ai_rpg <small id="subtitle">text-based LLM Dungeon Master</small></header>
  <div id="chat" aria-live="polite"></div>
  <form id="action-form" autocomplete="off">
    <input id="action-input" name="text" placeholder="What does your character do?" required maxlength="4000">
    <button id="action-send" type="submit">Send</button>
  </form>
</main>
<aside>
  <section id="session">
    <h2>Session</h2>
    <div class="kv"><span>turn</span><b id="turn-count">&mdash;</b></div>
    <div class="kv"><span>tokens</span><b id="token-count">&mdash;</b></div>
    <button id="new-session" type="button">New session (The Shadow Crown)</button>
  </section>
  <section id="llm-status">
    <h2>LLM</h2>
    <div><span class="dot"></span><span id="llm-state">checking&hellip;</span></div>
    <p id="llm-hello"></p>
    <div class="kv" style="margin-top:8px"><span>model</span><b id="model">&mdash;</b></div>
    <div class="kv"><span>endpoint</span><b id="base-url">&mdash;</b></div>
  </section>
  <section>
    <h2>Character</h2>
    <div id="pc-note">no sheet yet &mdash; start a session</div>
  </section>
  <section id="progress">
    <h2>Progress</h2>
    <div id="progress-note">no sheet yet &mdash; start a session</div>
    <div id="xp-bar"><div></div></div>
  </section>
  <section>
    <h2>Story</h2>
    <ul id="quest-log"><li>no spine yet</li></ul>
  </section>
  <section>
    <h2>Dice</h2>
    <div id="dice-log">no rolls yet</div>
  </section>
  <section>
    <h2>Milestone</h2>
    <div id="milestone" class="kv"><span>build</span><b>&mdash;</b></div>
  </section>
</aside>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('action-form');
const input = document.getElementById('action-input');
const send = document.getElementById('action-send');
const newSessionBtn = document.getElementById('new-session');
const pcNote = document.getElementById('pc-note');
const questLog = document.getElementById('quest-log');
const diceLog = document.getElementById('dice-log');
let busy = false;
let hasWorld = false;

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function j(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.detail || r.status + ' ' + r.statusText);
  }
  return r.json();
}

function parseFrames(buf) {
  // Yields {event, data} per complete SSE frame; returns the leftover tail.
  const frames = [];
  let idx;
  while ((idx = buf.indexOf('\n\n')) >= 0) {
    const raw = buf.slice(0, idx);
    buf = buf.slice(idx + 2);
    let event = 'message';
    const dataLines = [];
    for (const line of raw.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
    }
    frames.push({ event, data: dataLines.join('\n') });
  }
  return { frames, rest: buf };
}

function renderState(data) {
  hasWorld = true;
  const pc = data.pc;
  if (!pc) { pcNote.textContent = 'no sheet yet'; return; }
  const hp = pc.hp + '/' + pc.max_hp;
  const carrying = Object.entries(pc.inventory || {}).map(([n, q]) => q + 'x ' + n).join(', ');
  const held = Object.values(data.items || {}).filter((it) => (it.holder || '').startsWith('pc:')).map((it) => it.name);
  const lines = [
    '<b>' + pc.name + '</b> · AC ' + pc.ac,
    'HP <span class="' + (pc.hp <= Math.max(1, Math.floor(pc.max_hp / 3)) ? 'hp-low' : '') + '">' + hp + '</span> · gold ' + pc.gold + ' · XP ' + pc.xp,
    'Location: ' + (pc.location || '(unlocated)'),
  ];
  const goods = [carrying, held.join(', ')].filter(Boolean).join(', ');
  if (goods) lines.push('Carrying: ' + goods);
  pcNote.innerHTML = lines.join('<br>');
}

function renderProgress(progress) {
  const note = document.getElementById('progress-note');
  const bar = document.querySelector('#xp-bar > div');
  if (!progress) { note.textContent = 'no sheet yet — start a session'; bar.style.width = '0'; return; }
  const toNext = progress.xp_to_next !== null
    ? 'next level at ' + progress.next_level_xp + ' (' + progress.xp_to_next + ' to go)'
    : 'max level';
  note.textContent = 'level ' + progress.level + ' · XP ' + progress.xp + ' · ' + toNext;
  if (progress.xp_to_next !== null) {
    const base = progress.next_level_xp - progress.xp_to_next;  // xp at the current level
    bar.style.width = Math.min(100, Math.max(0, Math.round(100 * (progress.xp - base) / progress.xp_to_next))) + '%';
  } else {
    bar.style.width = '100%';
  }
}

function renderQuest(data) {
  questLog.innerHTML = '';
  const lines = data.quest_lines || [];
  if (!lines.length) lines.push(data.is_over ? 'The story is over.' : 'the spine is finished');
  for (const line of lines) {
    const li = document.createElement('li');
    if (line.startsWith('Current:')) li.className = 'current';
    li.textContent = line.replace('Current: ', '');
    questLog.appendChild(li);
  }
  for (const done of data.completed || []) {
    const li = document.createElement('li');
    li.textContent = '✓ ' + done;
    questLog.appendChild(li);
  }
}

function renderDice(data) {
  const roll = JSON.parse(data);
  const parts = [roll.label || 'roll'];
  if (roll.d20 !== undefined) parts.push('d20 ' + roll.d20);
  if (roll.total !== undefined) parts.push('= ' + roll.total);
  if (roll.dc !== undefined) parts.push('vs DC ' + roll.dc + (roll.success ? ' — success' : ' — fail'));
  if (roll.ac !== undefined) parts.push('vs AC ' + roll.ac + (roll.hit ? ' — hit' : ' — miss'));
  if (roll.critical) parts.push('CRITICAL');
  if (roll.fumble) parts.push('fumble');
  diceLog.innerHTML += parts.join(' ') + '<br>';
}

function restoreTranscript() {
  return j('/api/messages').then((data) => {
    for (const m of data.messages || []) {
      if (m.turn === 0 && m.role === 'user' && m.content.startsWith('/new')) continue;
      addMsg(m.role === 'user' ? 'player' : 'dm', m.content);
    }
  }).catch(() => {});
}

async function boot() {
  const box = document.getElementById('llm-status');
  try {
    const st = await j('/api/status');
    document.getElementById('model').textContent = st.model;
    document.getElementById('base-url').textContent = st.base_url;
    document.getElementById('milestone').querySelector('b').textContent =
      st.milestone + ' · v' + st.version;
    renderProgress(st.progress);
    hasWorld = st.world;
    newSessionBtn.disabled = st.world;
  } catch (e) {
    document.getElementById('base-url').textContent = String(e);
  }
  try {
    const p = await j('/api/ping');
    box.classList.add('ok');
    document.getElementById('llm-state').textContent = 'online';
    document.getElementById('llm-hello').textContent = '“' + p.reply + '”';
  } catch (e) {
    box.classList.add('err');
    document.getElementById('llm-state').textContent = 'offline';
    document.getElementById('llm-hello').textContent = e.message || String(e);
  }
  if (hasWorld) {
    await Promise.all([
      j('/api/world').then((d) => renderState(d.world)).catch(() => {}),
      j('/api/spine').then(renderQuest).catch(() => {}),
      restoreTranscript(),
    ]);
  }
}

newSessionBtn.addEventListener('click', async () => {
  if (busy) return;
  try {
    const r = await j('/api/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    hasWorld = true;
    newSessionBtn.disabled = true;
    chat.innerHTML = '';
    addMsg('system', '— ' + (r.world.pc.description || 'a new session begins') + ' —');
    renderState(r.world);
    j('/api/spine').then(renderQuest).catch(() => {});
    j('/api/status').then((st) => renderProgress(st.progress)).catch(() => {});
    input.focus();
  } catch (e) {
    addMsg('system', '⚠ ' + (e.message || e));
  }
});

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  busy = true;
  send.disabled = true;
  input.value = '';
  addMsg('player', text);
  const dm = addMsg('dm pending', '…');
  let written = false;
  try {
    const r = await fetch('/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok || !r.body) throw new Error(r.status + ' ' + r.statusText);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const { frames, rest } = parseFrames(buf);
      buf = rest;
      for (const f of frames) {
        if (f.event === 'narration') {
          dm.classList.remove('pending');
          dm.textContent = JSON.parse(f.data).text;
          chat.scrollTop = chat.scrollHeight;
          written = true;
        } else if (f.event === 'beat') {
          const b = JSON.parse(f.data).beat;
          if (b) addMsg('system', '— act ' + b.act + ': ' + b.text + ' —');
        } else if (f.event === 'quest') {
          renderQuest(JSON.parse(f.data));
        } else if (f.event === 'state') {
          const state = JSON.parse(f.data);
          renderState(state);
          if (state.turn !== undefined) document.getElementById('turn-count').textContent = state.turn;
        } else if (f.event === 'dice') {
          renderDice(f.data);
        } else if (f.event === 'tool') {
          const effect = JSON.parse(f.data);
          for (const line of effect.lines || []) addMsg('system', line);
        } else if (f.event === 'error') {
          const e = JSON.parse(f.data);
          addMsg('system', '⚠ ' + (e.error || f.data));
        } else if (f.event === 'done') {
          const d = JSON.parse(f.data);
          if (d.usage && (d.usage.prompt_tokens || d.usage.completion_tokens)) {
            document.getElementById('token-count').textContent =
              (d.usage.prompt_tokens || 0) + ' in / ' + (d.usage.completion_tokens || 0) + ' out';
          }
          if (d.progress) renderProgress(d.progress);
        }
      }
    }
    if (!written) { dm.classList.remove('pending'); dm.textContent = '(no narration)'; }
  } catch (e) {
    dm.classList.remove('pending');
    dm.textContent = '⚠ ' + (e.message || e);
  } finally {
    busy = false;
    send.disabled = false;
    input.focus();
  }
});

boot();
</script>
</body>
</html>
