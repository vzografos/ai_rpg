# ai_rpg — strict Docker (constraint C1). The host ever needs only Docker.
#
# Dev loop (source bind-mount, deps synced IN the container, uvicorn reload):
#   docker compose -f docker/compose.yml --profile dev up --build
# Tests (inside the container — never on the host):
#   docker compose -f docker/compose.yml --profile test run --rm test
# Local LLM (optional sibling service; then set LLM_* in .env):
#   docker compose -f docker/compose.yml --profile dev --profile ollama up --build
#   docker compose -f docker/compose.yml --profile ollama exec ollama ollama pull llama3.1:8b

name: ai-rpg

x-app-base: &app-base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ai-rpg:dev
  env_file:
    - path: ../.env
      required: false
  environment:
    RPG_DATA: /app/data
  volumes:
    - ../src:/app/src:z
    - ../tests:/app/tests:z
    - rpg-data:/app/data

services:
  app:
    <<: *app-base
    profiles: [dev]
    # Sync deps from the in-image lockfile, then serve with reload.
    entrypoint: ["/bin/sh", "-c", "uv sync --no-dev --frozen && exec uv run uvicorn rpg.web.app:app --host 0.0.0.0 --port 8080 --reload"]
    environment:
      RPG_DATA: /app/data
      RPG_DEBUG: "1"
    # Safe by default: loopback only. Set RPG_BIND_ADDR=<lan-ip> (or 0.0.0.0)
    # to expose it, and put an authenticating reverse proxy in front.
    ports:
      - "${RPG_BIND_ADDR:-127.0.0.1}:8080:8080"

  test:
    <<: *app-base
    profiles: [test]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "uv sync --no-dev --frozen && exec uv run pytest -v --cov=rpg.engine --cov-report=term-missing --cov-fail-under=100",
      ]

  # Hardened deployment (M6.4): the SAME image, no bind mounts (source is
  # baked in), read-only rootfs, the non-root `rpg` user (Dockerfile), a
  # persistent volume for the SQLite DB, and no-new-privileges. This is the
  # service the LXC runbook (docs/lxc-runbook.md) runs.
  prod:
    profiles: [prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-rpg:dev
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: ../.env
        required: false
    environment:
      RPG_DATA: /app/data
    volumes:
      - rpg-data:/app/data
    # Safe by default: loopback only. Set RPG_BIND_ADDR=<lan-ip> (or 0.0.0.0)
    # to expose it, and put an authenticating reverse proxy in front.
    ports:
      - "${RPG_BIND_ADDR:-127.0.0.1}:8080:8080"
    # Runs the image CMD (the baked venv's interpreter — see Dockerfile: no
    # `uv run` at runtime, because uv wants a writable cache a read-only
    # rootfs correctly refuses; the clean-machine acceptance found this).

  # Optional local model. Reachable from `app` as http://ollama:11434/v1.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    # Give the LXC host's GPU access here if you want local inference to be fast.

volumes:
  rpg-data:
  ollama-data:
